<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: system-ui, sans-serif; width: 280px; margin: 0; padding: 16px; color: #18181b; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  p { font-size: 12.5px; color: #52525b; line-height: 1.5; margin: 6px 0; }
  button { width: 100%; height: 38px; border: 0; border-radius: 8px; background: #059669; color: #fff; font-size: 13.5px; font-weight: 600; cursor: pointer; margin-top: 8px; }
  button:hover { background: #047857; }
  #msg { font-size: 12.5px; margin-top: 8px; min-height: 16px; }
</style>
</head>
<body>
  <h1>📌 CommentPulse Grabber</h1>
  <p>Open a post on Facebook, Instagram, TikTok, LinkedIn or Pinterest, scroll so the comments load, then click:</p>
  <button id="grab">Grab comments from this page</button>
  <div id="msg"></div>
  <p>It downloads <strong>commentpulse-comments.csv</strong>. Upload that file in CommentPulse → Upload CSV tab.</p>
  <script src="grab_fn.js"></script>
  <script src="popup.js"></script>
</body>
</html>
